name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint:code
      - run: pnpm format:check
      # status.yaml references secrets by name only; any value proves the shape.
      # If your config uses more `${VAR}`s than these, add them here — the lint
      # names the one it could not resolve, so a red build tells you which.
      - run: pnpm lint:config
        env:
          NTFY_URL: https://ntfy.example/ci
          HEARTBEAT_TOKEN: ci
      # Fails below the line threshold in vitest.config.ts.
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          jq -r '.total | "| Metric | Covered | % |\n|---|---|---|",
            (to_entries[] | select(.value | type == "object" and .total > 0)
              | "| \(.key) | \(.value.covered)/\(.value.total) | \(.value.pct)% |")' \
            coverage/coverage-summary.json | tee -a "$GITHUB_STEP_SUMMARY"

  # The package as a deployment gets it: packed, installed into a fresh copy of
  # the template with npm, and run through that deployment's own check.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:template
